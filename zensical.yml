theme:
  language: en
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    accent: green
    primary: deep purple
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    accent: light green
    primary: deep purple
    toggle:
      icon: lucide/moon
      name: Switch to light mode
extra:
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
      - icon: material/heart
        name: This page was helpful
        data: 1
        note: Thanks for your feedback!
      - icon: material/heart-broken
        name: This page could be improved
        data: 0
        note: 'Thanks for your feedback! Help us improve this page by

          <a href="https://github.com/D4Vinci/Scrapling/issues/new?template=04-docs_issue.yml" target="_blank" rel="noopener">opening
          a documentation issue</a>.

          '
  consent:
    title: Cookie consent
    description: 'We use cookies to recognize your repeated visits and preferences, as well

      as to measure the effectiveness of our documentation and whether users

      find what they''re searching for. With your consent, you''re helping us to

      make our documentation better.

      '
    actions:
    - accept
    - reject
    - manage
