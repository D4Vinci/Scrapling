name: Build and Push Docker Image

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag the images with, like 'v0.4.12'. Leave it empty to only push 'latest'"
        required: false
        default: ''

env:
  DOCKERHUB_IMAGE: pyd4vinci/scrapling
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/scrapling

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.user.login == github.repository_owner) }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # Releases come from the merged PR's title, the same source `release-and-publish.yml` uses, while a manual
    # run can pass the version itself to republish an image the release build failed to push.
    - name: Resolve the release version
      id: version
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="${INPUT_VERSION:-$PR_TITLE}"
        if [[ $VERSION =~ ^v[0-9] ]]; then
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagging the images with $VERSION"
        else
          echo "No release version given ('$VERSION'); skipping the version tags."
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CONTAINER_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.DOCKERHUB_IMAGE }}
          ${{ env.GHCR_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Scrapling
          org.opencontainers.image.description=An undetectable, powerful, flexible, high-performance Python library that makes Web Scraping easy and effortless as it should be!
          org.opencontainers.image.vendor=D4Vinci
          org.opencontainers.image.licenses=BSD
          org.opencontainers.image.url=https://scrapling.readthedocs.io/en/latest/
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.documentation=https://scrapling.readthedocs.io/en/latest/

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=min,ignore-error=true
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Image digest
      run: echo ${{ steps.build.outputs.digest }}